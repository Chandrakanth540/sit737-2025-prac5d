version: '3.8'

services:
  calculator-service:
    image: calculator
    container_name: calculator
    ports:
      - "3001:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/add?num1=5&num2=3"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    restart: always